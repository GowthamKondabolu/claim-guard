[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-guard"
version = "0.1.0"
description = "Explainable healthcare claims anomaly ranking and payment integrity platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gowtham Kondabolu" }]
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.4",
  "numpy>=2.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.3",
  "ruff>=0.8",
]
spark = [
  "pyspark>=4.2,<4.3",
]
[project.scripts]
claimguard = "claimguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
  "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
